<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Academia CONECTA · Avanzado</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0a0e1a;--card:#111827;--border:#1f2d45;--accent:#2563eb;--text:#e2e8f0;--muted:#64748b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:12px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.7}.container{max-width:1000px;margin:0 auto;padding:2rem}header{text-align:center;padding:2rem 0;border-bottom:1px solid var(--border);margin-bottom:2rem}header h1{font-family:'Outfit',sans-serif;font-size:2.2rem;font-weight:800}header .sub{color:var(--accent);font-size:1rem;margin-top:.3rem}.stats{display:flex;justify-content:center;gap:3rem;margin-top:1.5rem;flex-wrap:wrap}.stat{text-align:center}.stat-val{font-family:'IBM Plex Mono',monospace;font-size:1.8rem;font-weight:700;color:var(--accent)}.stat-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin:2rem 0}.module-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}.module-card:hover{border-color:var(--accent);transform:translateY(-2px)}.module-card.locked{opacity:.4;cursor:not-allowed;pointer-events:none}.module-card .num{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--accent);font-weight:600;letter-spacing:.05em;text-transform:uppercase}.module-card h3{font-family:'Outfit',sans-serif;font-size:1.1rem;margin:.3rem 0 .5rem}.module-card .desc{font-size:.82rem;color:var(--muted);flex:1}.module-card .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}.module-card .score{font-family:'IBM Plex Mono',monospace;font-size:.8rem}.module-card .score.ok{color:var(--success)}.module-card .score.low{color:var(--warning)}.module-card .badge{font-size:.65rem;padding:.2rem .7rem;border-radius:100px;font-weight:600}.module-card .badge.done{background:rgba(16,185,129,.12);color:var(--success)}.module-card .badge.waiting{background:rgba(245,158,11,.12);color:var(--warning)}.badge.blocked{background:rgba(100,116,139,.12);color:var(--muted)}.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.3rem;border-radius:100px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3b82f6}.btn-sm{padding:.4rem .9rem;font-size:.7rem}.hidden{display:none!important}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.97);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto}.modal-overlay.hidden{display:none!important}.modal-close{position:fixed;top:1rem;right:1rem;background:var(--danger);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center}.modal-frame{width:100%;max-width:960px;min-height:100vh;border:none;margin-top:50px}footer{text-align:center;padding:2rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:3rem}@media(max-width:700px){.container{padding:1rem}header h1{font-size:1.6rem}.modules-grid{grid-template-columns:1fr}}</style></head><body><div class="container">
<header><h1>🧠 Academia CONECTA · Nivel Avanzado</h1><p class="sub">Metodología TTung de Ventas B2B · Casos Reales · Deep Learning</p>
<div class="stats"><div class="stat"><div class="stat-val" id="sc">0</div><div class="stat-lbl">Completados</div></div><div class="stat"><div class="stat-val" id="sa">—</div><div class="stat-lbl">Promedio</div></div><div class="stat"><div class="stat-val" id="sb">—</div><div class="stat-lbl">Mejor Score</div></div></div></header>
<div class="modules-grid" id="grid"></div>
<footer>CONECTA Ingeniería · TTung Agent System · Progreso guardado en este navegador<br><button class="btn btn-sm" onclick="if(confirm('Borrar progreso?')){localStorage.clear();location.reload()}" style="margin-top:.5rem;background:transparent;border:1px solid var(--border);color:var(--muted)">🗑️ Reiniciar</button></footer></div>
<div class="modal-overlay hidden" id="modal"><button class="modal-close" onclick="closeModal()">✕</button><iframe class="modal-frame" id="frame"></iframe></div>
<script>
var M=[{id:1,f:'modulo1-deep.html',t:'El Abismo Técnico-Comercial',d:'Casos Agrosuper + Transelec · CNV · Vector de Diferenciación · Tu Zippo',q:10,th:7},{id:2,f:'modulo2-deep.html',t:'La Escalera P×M×R',d:'Validación de servicios · Capacidad de Respuesta · Caso PMU Vizimax · 3 Caminos',q:5,th:4},{id:3,f:'modulo3-deep.html',t:'Mapa de Dinero',d:'Segmentación de nichos · Matriz 3×3 · Portafolio CONECTA · Meta con sobre-desempeño',q:3,th:2},{id:4,f:'modulo4-deep.html',t:'El TAE — Ejecución Diaria',d:'Tabla de Acciones · Semáforos · Campeón vs Huérfano · Caso Minera Meridian $180K',q:4,th:3},{id:5,f:'modulo5-deep.html',t:'La Mina de Oro',d:'15 Preguntas por Rol · Señales de Veta · Documentación · Caso Transelec PMU',q:4,th:3},{id:6,f:'modulo6-deep.html',t:'Objeciones — El Arte de Cerrar',d:'6 Objeciones · Protocolo Vivation · CNV · Frase de Cierre · 🏆 Certificación',q:6,th:5}],K='ca_progress';
function G(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function S(mid,sc,tot,pass){var p=G();p[mid]={s:sc,t:tot,p:pass,d:new Date().toISOString()};localStorage.setItem(K,JSON.stringify(p));R()}
function R(){var p=G(),g=document.getElementById('grid'),c=0,ts=0,bs=0;
g.innerHTML=M.map(function(m,i){var d=p[m.id]&&p[m.id].p,sc=p[m.id]?p[m.id].s:null,l=i>0&&!(p[i]&&p[i].p),scC='',bC='blocked',bT='🔒 Anterior',cl='';if(d){scC='ok';bC='done';bT='✅ '+sc+'/'+m.q;c++;if(sc>bs)bs=sc;ts+=sc}else if(!l){bC='waiting';bT='📖 Disponible';scC=sc&&sc<m.th?'low':''}
return '<div class="module-card'+(l?' locked':'')+'"'+(l?'':' onclick="O('+m.id+')"')+'><div class="num">MÓDULO '+m.id+'</div><h3>'+m.t+'</h3><div class="desc">'+m.d+'</div><div class="meta-row"><span class="score'+(scC?' '+scC:'')+'">'+(sc!==null?sc+'/'+m.q:'—')+'</span><span class="badge '+bC+'">'+bT+'</span></div>'+(l?'':'<button class="btn btn-primary btn-sm" style="margin-top:.5rem;width:100%;justify-content:center" onclick="event.stopPropagation();O('+m.id+')">▶ Abrir</button>')+'</div>'}).join('');
document.getElementById('sc').textContent=c+'/6';document.getElementById('sa').textContent=c?Math.round(ts/c)+'%':'—';document.getElementById('sb').textContent=c?Math.round(bs/c*100/(M.find(function(x){return x.id===c})?.q||100))+'%':'—'}
function O(id){var m=M.find(function(x){return x.id===id});if(!m)return;document.getElementById('modal').classList.remove('hidden');document.getElementById('frame').src=m.f;document.getElementById('frame').dataset.mid=id}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('frame').src='';R()}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='test_result'){var mid=parseInt(e.data.mid||e.data.moduleId);var m=M.find(function(x){return x.id===mid});if(m){S(mid,e.data.score,e.data.total,e.data.score>=m.th);closeModal()}}});
R();
</script></body></html>
