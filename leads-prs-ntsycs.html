var F='all', P=1, PP=25;
function setFilter(f){F=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');goPage(1)}
function goPage(p){P=p;var s=document.getElementById('search').value.toLowerCase();var d=D.filter(function(r){var ok=F==='all'||(F==='mining'?r.m:(r.f||'').toLowerCase().includes(F));return ok&&(!s||r.c.toLowerCase().includes(s))});var tp=Math.ceil(d.length/PP);if(P>tp)P=tp;if(P<1)P=1;var start=(P-1)*PP;var page=d.slice(start,start+PP);

var pg='';for(var i=1;i<=tp;i++){if(tp<=15||i===1||i===tp||Math.abs(i-P)<=2)pg+='<button class="page-btn'+(i===P?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';else if(i===2||i===tp-1)pg+='<button class="page-btn gap">…</button>'}document.getElementById('pager').innerHTML=pg}
